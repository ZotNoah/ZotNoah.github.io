<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <title>Document</title>
    <script src="game.js" defer></script>
</head>
<body>
    <div class="characterContainer">
        <div id="player" class="characters">
            <h1 id="playerName"></h1>
            <p class="health" id="playerHealth"></p>

        </div>
        <div>
            <h1>Turn: </h1>
            <p id="moveTurn"></p>
        </div>
        <div id="enemy" class="characters">
            <h1 id="enemyName"></h1>
            <p class="health" id="enemyHealth">health: 100</p>

        </div>
    </div>
    <div class="gameMenu">
        <button id="fireBall">Fire Ball</button>
        <button id="lightningStrike">Lightning Strike</button>
        <button id="frostBite">Frost Bite</button>

    </div>
    
</body>
</html>
